<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国历史全景时间轴</title>
<style>
  /* 独立打开时的样式兜底（在 Kimi 内由客户端提供同名变量） */
  :root{
    --kimi-font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --kimi-color-text-primary:#1a1a1a; --kimi-color-text-secondary:#5c5c5c;
    --kimi-color-text-tertiary:#8a8a8a; --kimi-color-text-quaternary:#b5b5b5;
    --kimi-color-border:#e2e2e2; --kimi-color-warning:#b25e09;
    --kimi-chart-1:#3b6fd4; --kimi-chart-2:#c94f4f; --kimi-chart-3:#3f9e6e;
    --kimi-chart-4:#8a5fc0; --kimi-chart-5:#8a8a8a;
    --kimi-space-1:4px; --kimi-space-2:8px; --kimi-space-3:12px;
    --kimi-space-4:16px; --kimi-space-5:20px; --kimi-space-6:24px; --kimi-space-7:32px;
    --kimi-radius-chip:6px; --kimi-radius-panel:12px; --kimi-radius-full:999px;
    --t-fast:120ms; --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --kimi-color-text-primary:#f0f0f0; --kimi-color-text-secondary:#b0b0b0;
      --kimi-color-text-tertiary:#7d7d7d; --kimi-color-text-quaternary:#5a5a5a;
      --kimi-color-border:#3a3a3a; --kimi-color-warning:#e0a050;
    }
    body{ background:#1c1c1e; }
  }
  body{ margin:0; }
  .kimi-page-title{ font-size:20px; font-weight:500; }
  .kimi-meta{ font-size:12px; color:var(--kimi-color-text-tertiary); }
  .kimi-chip{
    border:1px solid var(--kimi-color-border); background:transparent; border-radius:6px;
    padding:2px 10px; font-size:13px; cursor:pointer; color:var(--kimi-color-text-secondary);
  }
  .kimi-chip[aria-pressed="true"]{ color:var(--kimi-color-text-primary); border-color:var(--kimi-color-text-primary); }
  .kimi-segmented{ display:inline-flex; gap:4px; }
  .kimi-button{
    border:1px solid var(--kimi-color-border); background:transparent; border-radius:8px;
    padding:2px 10px; font-size:14px; cursor:pointer; color:var(--kimi-color-text-primary);
  }
  .kimi-range{ accent-color:var(--kimi-color-text-primary); }
  .wrap{ max-width:1400px; margin:0 auto; }
</style>
<style>
  .wrap{
    font-family: var(--kimi-font-sans);
    padding-block-start: var(--kimi-space-4);
    padding-inline: var(--kimi-space-4);
    width: 100%;
    box-sizing: border-box;
  }
  button, input, select, textarea{ font: inherit; }
  .head{ display:flex; flex-direction:column; gap: var(--kimi-space-2); margin-bottom: var(--kimi-space-3); }
  .title-row{ display:flex; align-items:baseline; gap: var(--kimi-space-3); flex-wrap:wrap; }
  .controls{ display:flex; align-items:center; gap: var(--kimi-space-3); flex-wrap:wrap; }
  .zoom-row{ display:flex; align-items:center; gap: var(--kimi-space-2); }
  .zoom-row .kimi-range{ width:110px; accent-color: var(--kimi-color-text-primary); }
  .zoom-val{ font-size:12px; color: var(--kimi-color-text-secondary); min-width:34px; font-variant-numeric: tabular-nums; }
  .lane-toggles{ display:flex; gap:6px; flex-wrap:wrap; }
  .lt-chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-full);
    padding:2px 10px; font-size:12px; cursor:pointer; background:transparent;
    color: var(--kimi-color-text-secondary);
    transition: opacity var(--t-fast) var(--ease-out);
  }
  .lt-chip .dot{ width:8px; height:8px; border-radius:50%; }
  .lt-chip.off{ opacity:.38; }
  .lt-chip:hover{ color: var(--kimi-color-text-primary); }

  .tl-body{ display:flex; border-top:1px solid var(--kimi-color-border); border-bottom:1px solid var(--kimi-color-border); }
  .lane-labels{ flex:0 0 92px; padding-top:26px; }
  .lane-label{
    box-sizing:border-box; display:flex; flex-direction:column; justify-content:center;
    padding-inline-end: var(--kimi-space-2);
  }
  .lane-label .nm{ font-size:13px; font-weight:500; color: var(--kimi-color-text-primary); }
  .lane-label .ct{ font-size:11px; color: var(--kimi-color-text-tertiary); font-variant-numeric: tabular-nums; }
  .tl-scroll{ flex:1; overflow-x:auto; overflow-y:hidden; position:relative; }
  .tl-canvas{ position:relative; }
  .axis{ position:relative; height:26px; border-bottom:1px solid var(--kimi-color-border); }
  .tick{ position:absolute; top:0; bottom:0; border-left:1px solid var(--kimi-color-border); }
  .tick span{ position:absolute; top:5px; left:4px; font-size:11px; color: var(--kimi-color-text-tertiary); white-space:nowrap; font-variant-numeric: tabular-nums; }
  .segline{ position:absolute; top:0; bottom:0; border-left:1px dashed var(--kimi-color-border); pointer-events:none; }

  .lane{ position:relative; border-bottom:1px dashed var(--kimi-color-border); }
  .lane:last-child{ border-bottom:none; }
  .lane.hidden{ display:none; }
  .bar{
    position:absolute; height:16px; border-radius:4px;
    font-size:12px; line-height:16px; white-space:nowrap; cursor:pointer;
    border:1px solid; overflow:visible;
  }
  .bar .in{ display:block; width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; padding:0 4px; box-sizing:border-box; }
  .bar .out{ position:absolute; left:calc(100% + 4px); top:0; color: var(--kimi-color-text-secondary); }
  .bar.sel{ outline:2px solid var(--kimi-color-text-primary); outline-offset:1px; }
  .bar:hover{ filter:brightness(1.06); }
  .evt{ position:absolute; width:0; cursor:pointer; }
  .evt .d{
    position:absolute; left:-4px; top:2px; width:8px; height:8px; transform:rotate(45deg);
    border-radius:1px;
  }
  .evt .t{ position:absolute; top:0; left:6px; font-size:12px; white-space:nowrap; color: var(--kimi-color-text-secondary); }
  .evt.sel .t{ color: var(--kimi-color-text-primary); font-weight:500; }
  .evt.sel .d{ outline:2px solid var(--kimi-color-text-primary); outline-offset:1px; }
  .evt:hover .t{ color: var(--kimi-color-text-primary); }

  .detail{
    margin-top: var(--kimi-space-3);
    border:1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel);
    padding: var(--kimi-space-3); min-height:56px; box-sizing:border-box;
  }
  .detail .d-title{ font-size:15px; font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail .d-range{ font-size:12px; color: var(--kimi-color-text-secondary); font-variant-numeric: tabular-nums; }
  .detail .d-desc{ font-size:13px; color: var(--kimi-color-text-secondary); margin-top:4px; line-height:1.55; }
  .detail .d-note{ font-size:12px; margin-top:6px; padding:3px 8px; display:inline-block; border-radius: var(--kimi-radius-chip);
    color: var(--kimi-color-warning); background: color-mix(in srgb, var(--kimi-color-warning) 12%, transparent); }
  .detail .empty{ font-size:13px; color: var(--kimi-color-text-tertiary); }
  .foot{ margin-top: var(--kimi-space-2); margin-bottom: var(--kimi-space-4); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title-row">
      <span class="kimi-page-title">中国历史全景时间轴</span>
      <span class="kimi-meta">五种划分体系对齐 · 拖动浏览 · 点击条目看详情</span>
    </div>
    <div class="controls">
      <div class="kimi-segmented" id="eraChips" aria-label="跳转时代"></div>
      <div class="zoom-row">
        <button class="kimi-button kimi-button--secondary" id="zoomOut" aria-label="缩小">−</button>
        <input class="kimi-range" id="zoom" type="range" min="0.6" max="8" step="0.1" value="1" aria-label="缩放">
        <button class="kimi-button kimi-button--secondary" id="zoomIn" aria-label="放大">+</button>
        <span class="zoom-val" id="zoomVal">1.0×</span>
      </div>
    </div>
    <div class="lane-toggles" id="laneToggles"></div>
  </div>
  <div class="tl-body">
    <div class="lane-labels" id="laneLabels"></div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-canvas" id="tlCanvas">
        <div class="axis" id="axis"></div>
        <div id="lanes"></div>
      </div>
    </div>
  </div>
  <div class="detail" id="detail"><span class="empty">点击时间轴上的色块或菱形节点，查看该时代 / 朝代 / 遗址 / 事件的说明。</span></div>
  <div class="kimi-meta foot">年代依据：夏商周断代工程（2000）、中华文明探源工程及公开碳十四测年数据；标「存争议」者学界尚无定论。横向滚动或缩放查看细节。</div>
</div>

<script>
(function(){
  "use strict";
  /* ===== 时间坐标：分段线性映射（负数为公元前） ===== */
  var SEGS = [
    {from:-2000000, to:-12000, w:520,  tick:400000, name:"远古"},
    {from:-12000,   to:-2070,  w:760,  tick:2000,   name:"新石器"},
    {from:-2070,    to:-221,   w:840,  tick:500,    name:"夏商周"},
    {from:-221,     to:1912,   w:1720, tick:400,    name:"帝制时代"},
    {from:1912,     to:2027,   w:660,  tick:20,     name:"近现代"}
  ];
  function fmtYear(y){
    if(y <= -10000){ var v = -y/10000; return "约" + (Math.round(v*10)/10) + "万年前"; }
    if(y < 0) return "前" + (-y) + "年";
    return y + "年";
  }
  function fmtRange(s,e){ return s===e ? fmtYear(s) : fmtYear(s)+" — "+fmtYear(e); }

  /* ===== 数据 ===== */
  var LANES = [
  { id:"arch", name:"考古学时代", color:"var(--kimi-chart-1)", kind:"bar", items:[
    {n:"旧石器时代早期", s:-2000000, e:-200000, d:"打制石器为主，学会用火。代表古人类：元谋人、蓝田人、北京人（周口店）、郧县人等直立人。"},
    {n:"旧石器时代中期", s:-200000, e:-40000, d:"早期智人阶段：大荔人、丁村人、许家窑人等；石器打制技术改进。"},
    {n:"旧石器时代晚期", s:-40000, e:-10000, d:"晚期智人（山顶洞人、田园洞人）出现；约2万年前江西仙人洞烧制出世界最早的陶器。"},
    {n:"新石器时代早期", s:-10000, e:-7000, d:"农业起源的关键期：上山文化稻作遗存、贾湖遗址；磨制石器普及，定居村落出现。"},
    {n:"新石器时代中期", s:-7000, e:-5000, d:"兴隆洼、河姆渡、仰韶早期并起；粟作（北方）与稻作（南方）农业成熟，玉器传统开端。"},
    {n:"新石器时代晚期", s:-5000, e:-2600, d:"仰韶、大汶口、良渚、红山等区域文化并起。探源工程指出：约前3800年起社会分化加速，进入文明起源关键阶段。"},
    {n:"龙山时代（铜石并用）", s:-2600, e:-1900, d:"黑陶与城址林立：陶寺、石峁、石家河等；早期铜器出现，'万邦林立'。"},
    {n:"青铜时代", s:-1750, e:-500, d:"二里头开启王朝文明，商周青铜礼乐文明鼎盛（殷墟、三星堆）。更早的铜器可追溯至齐家文化。"},
    {n:"早期铁器时代", s:-800, e:-221, d:"春秋时期铁器出现并逐步普及，战国时铁农具与牛耕推广，生产力跃升。"}
  ]},
  { id:"hist", name:"史学划分", color:"var(--kimi-chart-5)", kind:"bar", items:[
    {n:"原始社会", s:-2000000, e:-2070, d:"五种社会形态说：采集渔猎→农耕氏族社会（母系→父系）。"},
    {n:"奴隶社会", s:-2070, e:-476, d:"传统分期（郭沫若等）：夏商周至春秋。'中国有无奴隶社会'在学界长期有争议。", note:"存争议"},
    {n:"封建社会", s:-475, e:1840, d:"战国封建说：战国至清中期。'封建'一词的内涵（分封制 vs 社会形态）学界亦有讨论。", note:"术语有争议"},
    {n:"半殖民地半封建社会", s:1840, e:1949, d:"鸦片战争后中国社会性质的经典表述。"},
    {n:"社会主义社会", s:1949, e:2027, d:"1949年新中国成立，1956年三大改造完成后确立社会主义基本制度。"},
    {n:"传说时代（三皇五帝）", s:-3000, e:-2070, d:"黄帝、尧、舜、禹等见于后世文献追记，可与龙山时代考古文化大致对应，但无当时文字实证。"},
    {n:"古国时代（探源工程）", s:-3800, e:-1800, d:"中华文明探源工程划分：区域文明并起，良渚、陶寺、石峁等进入早期国家阶段。"},
    {n:"王朝时代（探源工程）", s:-1800, e:1912, d:"探源工程划分：二里头之后，以中原王朝为中心的历史趋势确立。"},
    {n:"信史时代", s:-841, e:2027, d:"前841年（共和元年）起，中国历史始有连续确切纪年；甲骨文则把可证历史推至商代。"},
    {n:"先秦时期", s:-2070, e:-221, d:"夏商周三代，中华文明的奠基期。"},
    {n:"秦汉", s:-221, e:220, d:"大一统帝国格局确立。"},
    {n:"魏晋南北朝", s:220, e:589, d:"长期分裂与民族大融合。"},
    {n:"隋唐五代", s:581, e:979, d:"再统一与盛世，制度与文化高峰。"},
    {n:"辽宋夏金元", s:916, e:1368, d:"多政权并立到元朝大一统。"},
    {n:"明清（前中期）", s:1368, e:1840, d:"统一多民族国家巩固，传统社会晚期。"},
    {n:"中国近代史", s:1840, e:1949, d:"从鸦片战争到新中国成立。"},
    {n:"中国现代史", s:1949, e:2027, d:"中华人民共和国时期。"}
  ]},
  { id:"dyn", name:"朝代更迭", color:"var(--kimi-chart-2)", kind:"bar", items:[
    {n:"夏", s:-2070, e:-1600, d:"断代工程推定年代。考古上多认为二里头文化对应夏中晚期都邑；夏的存在与确切年代国际学界仍有争议。", note:"年代存争议"},
    {n:"商", s:-1600, e:-1046, d:"甲骨文与青铜文明；晚期都于殷（今安阳殷墟）。"},
    {n:"西周", s:-1046, e:-771, d:"武王伐纣（前1046，断代工程结论）；分封制、宗法制、礼乐文明。"},
    {n:"春秋", s:-770, e:-476, d:"平王东迁后诸侯争霸（春秋五霸）；孔子、老子活动于此期。"},
    {n:"战国", s:-475, e:-221, d:"七雄并立，各国变法（商鞅变法）；百家争鸣。"},
    {n:"秦", s:-221, e:-207, d:"中国第一个统一的中央集权帝国：郡县制、书同文、车同轨、统一度量衡。"},
    {n:"西汉", s:-202, e:8, d:"文景之治、汉武盛世；丝绸之路开通，儒家正统确立。"},
    {n:"新", s:9, e:23, d:"王莽篡汉改制，激化社会矛盾，亡于绿林赤眉起义。"},
    {n:"东汉", s:25, e:220, d:"光武中兴；蔡伦改进造纸术（105年）；末年黄巾起义。"},
    {n:"三国", s:220, e:280, d:"魏、蜀、吴鼎立；280年西晋灭吴统一。"},
    {n:"西晋", s:266, e:316, d:"短暂统一；八王之乱、永嘉之乱后崩溃。"},
    {n:"东晋", s:317, e:420, d:"偏安江南，门阀士族政治；淝水之战（383）保住半壁江山。"},
    {n:"十六国", s:304, e:439, d:"北方与巴蜀政权更迭频繁，民族大迁徙、大融合。"},
    {n:"南北朝", s:420, e:589, d:"南朝宋齐梁陈 vs 北朝北魏→东西魏→北齐北周；北魏孝文帝改革促进汉化。"},
    {n:"隋", s:581, e:618, d:"结束三百年分裂；开创科举、凿大运河；二世而亡。"},
    {n:"唐", s:618, e:907, d:"贞观之治、开元盛世；诗歌、三省六部、两税法；安史之乱（755）由盛转衰。"},
    {n:"五代十国", s:907, e:979, d:"中原五代更迭、南方十国并立，为宋的统一铺垫。"},
    {n:"辽", s:916, e:1125, d:"契丹建立，与北宋对峙；创南北面官制、契丹文字。"},
    {n:"北宋", s:960, e:1127, d:"经济文化高峰：活字印刷、交子（世界最早纸币）、理学兴起；亡于靖康之变。"},
    {n:"西夏", s:1038, e:1227, d:"党项建立，创西夏文；亡于蒙古。"},
    {n:"金", s:1115, e:1234, d:"女真建立，灭辽与北宋，与南宋对峙。"},
    {n:"南宋", s:1127, e:1279, d:"经济重心南移完成；1279年崖山海战后亡于元。"},

    {n:"中华民国", s:1912, e:1949, d:"共和肇建，历军阀混战、北伐、抗日战争与内战；1949年国民政府迁台。"},
    {n:"中华人民共和国", s:1949, e:2027, d:"1949年10月1日成立；1978年改革开放后经济高速增长。"}

  { id:"site", name:"遗址·文化·古人类", color:"var(--kimi-chart-3)", kind:"bar", items:[

  { id:"event", name:"大事记", color:"var(--kimi-chart-4)", kind:"event", items:[

    {n:"加入WTO", s:2001, e:2001, d:"深度融入全球经济体系。"},
    {n:"北京奥运会", s:2008, e:2008, d:"首次举办夏季奥运会。"},
    {n:"全面建成小康社会", s:2021, e:2021, d:"第一个百年奋斗目标实现。"}
  ]}
  ];

  /* ===== 布局参数 ===== */
  var ROW_H = 22, LANE_GAP = 8, PAD_R = 60;
  var mc = document.createElement("canvas").getContext("2d");
  mc.font = "12px " + getComputedStyle(document.body).fontFamily;
  function tw(t){ return Math.ceil(mc.measureText(t).width); }

  var zoom = 1;
  function buildX(){
    var acc = 0, map = [];
    SEGS.forEach(function(sg){
      var w = sg.w * zoom;
      map.push({from:sg.from, to:sg.to, x0:acc, scale:w/(sg.to-sg.from)});
      acc += w;
    });
    return {map:map, total:acc};
  }
  function tx(y, geom){
    for(var i=0;i<geom.map.length;i++){
      var m = geom.map[i];
      if(y <= m.to) return m.x0 + (y - m.from) * m.scale;
    }
    var last = geom.map[geom.map.length-1];
    return last.x0 + (y - last.from) * last.scale;
  }

  var elScroll = document.getElementById("tlScroll"),
      elCanvas = document.getElementById("tlCanvas"),
      elAxis = document.getElementById("axis"),
      elLanes = document.getElementById("lanes"),
      elLabels = document.getElementById("laneLabels"),
      elDetail = document.getElementById("detail"),
      laneVisible = {}, selEl = null;

  LANES.forEach(function(l){ laneVisible[l.id] = true; });

  function tickFmt(y, step){
    if(y <= -10000){ var v=-y/10000; return (Math.round(v*10)/10)+"万年前"; }
    if(y < 0) return "前"+(-y);
    return ""+y;
  }

  function render(){
    var geom = buildX();
    elCanvas.style.width = Math.ceil(geom.total + PAD_R) + "px";

    /* --- 轴 --- */
    elAxis.innerHTML = "";
    SEGS.forEach(function(sg, si){
      var m = geom.map[si];
      var step = sg.tick;
      var start = Math.ceil(sg.from/step)*step;
      for(var y=start; y<sg.to; y+=step){
        var x = tx(y, geom);
        var t = document.createElement("div");
        t.className = "tick"; t.style.left = x+"px";
        var s = document.createElement("span"); s.textContent = tickFmt(y, step);
        t.appendChild(s); elAxis.appendChild(t);
      }
      if(si>0){
        var sl = document.createElement("div");
        sl.className = "segline"; sl.style.left = m.x0+"px";
        sl.style.top = "0"; sl.style.height = "100%";
        elAxis.appendChild(sl);
      }
    });

    /* --- 泳道 --- */
    elLanes.innerHTML = "";
    elLabels.innerHTML = "";
    LANES.forEach(function(lane){
      if(!laneVisible[lane.id]){
        var lb0 = document.createElement("div");
        lb0.className = "lane-label"; lb0.style.height = "0px"; lb0.style.overflow="hidden";
        elLabels.appendChild(lb0);
        return;
      }
      /* 行装填 */
      var rows = [];
      var sorted = lane.items.slice().sort(function(a,b){ return a.s-b.s || a.e-b.e; });
      var placed = sorted.map(function(it){
        var x1 = tx(it.s, geom), x2 = it.s===it.e ? x1 : tx(it.e, geom);
        var labelW = tw(it.n) + (lane.kind==="event" ? 10 : 8);
        var barW = Math.max(x2-x1, 3);
        var occStart, occEnd;
        if(lane.kind==="event" || barW < labelW){
          occStart = x1 - 0; occEnd = x1 + labelW;
          if(lane.kind==="bar"){ occStart = x1; occEnd = x2 + 4 + labelW; }
        } else { occStart = x1; occEnd = x2; }
        var r = 0;
        for(;;){
          if(!rows[r]) rows[r] = -Infinity;
          if(occStart > rows[r] + 6){ rows[r] = occEnd; break; }
          r++;
        }
        return {it:it, x1:x1, x2:x2, barW:barW, row:r, labelW:labelW};
      });
      var nRows = rows.length;
      var laneH = nRows*ROW_H + LANE_GAP;

      var div = document.createElement("div");
      div.className = "lane"; div.style.height = laneH+"px";
      placed.forEach(function(p){
        var top = p.row*ROW_H + 3;
        var el;
        if(lane.kind === "event"){
          el = document.createElement("div");
          el.className = "evt"; el.style.left = p.x1+"px"; el.style.top = (top+1)+"px";
          el.innerHTML = '<span class="d" style="background:'+lane.color+'"></span><span class="t"></span>';
          el.querySelector(".t").textContent = p.it.n;
        } else {
          el = document.createElement("div");
          el.className = "bar"; el.style.left = p.x1+"px"; el.style.top = top+"px";
          el.style.width = p.barW+"px";
          el.style.borderColor = "color-mix(in srgb, "+lane.color+" 55%, transparent)";
          el.style.background = "color-mix(in srgb, "+lane.color+" 14%, transparent)";
          if(p.barW >= p.labelW){
            el.innerHTML = '<span class="in" style="color:var(--kimi-color-text-primary)"></span>';
            el.querySelector(".in").textContent = p.it.n;
          } else {
            el.innerHTML = '<span class="out"></span>';
            el.querySelector(".out").textContent = p.it.n;
          }
        }
        el.addEventListener("click", function(){ select(el, p.it, lane); });
        div.appendChild(el);
      });
      elLanes.appendChild(div);

      var lb = document.createElement("div");
      lb.className = "lane-label"; lb.style.height = laneH+"px";
      lb.innerHTML = '<span class="nm"></span><span class="ct"></span>';
      lb.querySelector(".nm").textContent = lane.name;
      lb.querySelector(".nm").style.color = "color-mix(in srgb, "+lane.color+" 80%, var(--kimi-color-text-primary))";
      lb.querySelector(".ct").textContent = lane.items.length + " 条";
      elLabels.appendChild(lb);
    });
  }

  function select(el, it, lane){
    if(selEl) selEl.classList.remove("sel");
    if(selEl === el){ selEl = null;
      elDetail.innerHTML = '<span class="empty">点击时间轴上的色块或菱形节点，查看该时代 / 朝代 / 遗址 / 事件的说明。</span>';
      return;
    }
    selEl = el; el.classList.add("sel");
    var html = '<div class="d-title"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:'+lane.color+';display:inline-block"></span>'
      + esc(it.n) + ' <span class="d-range">' + fmtRange(it.s, it.e) + ' · ' + lane.name + '</span></div>'
      + '<div class="d-desc">' + esc(it.d||"") + '</div>';
    if(it.note) html += '<div><span class="d-note">⚠ ' + esc(it.note) + '</span></div>';
    elDetail.innerHTML = html;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  /* --- 泳道开关 --- */
  var ltWrap = document.getElementById("laneToggles");
  LANES.forEach(function(lane){
    var c = document.createElement("button");
    c.className = "lt-chip";
    c.innerHTML = '<span class="dot" style="background:'+lane.color+'"></span>' + lane.name;
    c.setAttribute("aria-pressed","true");
    c.addEventListener("click", function(){
      laneVisible[lane.id] = !laneVisible[lane.id];
      c.classList.toggle("off", !laneVisible[lane.id]);
      c.setAttribute("aria-pressed", String(laneVisible[lane.id]));
      render();
    });
    ltWrap.appendChild(c);
  });

  /* --- 时代跳转 --- */
  var ERAS = [["远古",-2000000],["新石器",-10000],["夏商周",-2070],["秦汉",-221],["唐宋",618],["明清",1368],["近现代",1840]];
  var eraWrap = document.getElementById("eraChips");
  ERAS.forEach(function(e, i){
    var b = document.createElement("button");
    b.className = "kimi-chip"; b.textContent = e[0];
    b.setAttribute("aria-pressed", i===0 ? "true":"false");
    b.addEventListener("click", function(){
      var geom = buildX();
      elScroll.scrollLeft = Math.max(0, tx(e[1], geom) - 40);
      eraWrap.querySelectorAll(".kimi-chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
    });
    eraWrap.appendChild(b);
  });

  /* --- 缩放 --- */
  var zoomInp = document.getElementById("zoom"),
      zoomVal = document.getElementById("zoomVal");
  function applyZoom(nz){
    nz = Math.min(8, Math.max(0.6, nz));
    var geom = buildX();
    var cx = elScroll.scrollLeft + elScroll.clientWidth/2;
    /* 找中心对应的年 */
    var yr = SEGS[0].from;
    for(var i=0;i<geom.map.length;i++){ var m=geom.map[i];
      if(cx <= m.x0 + (m.to-m.from)*m.scale || i===geom.map.length-1){
        yr = m.from + (cx - m.x0)/m.scale; break; } }
    zoom = nz;
    zoomInp.value = String(nz);
    zoomVal.textContent = nz.toFixed(1) + "×";
    render();
    var g2 = buildX();
    elScroll.scrollLeft = Math.max(0, tx(yr, g2) - elScroll.clientWidth/2);
  }
  zoomInp.addEventListener("input", function(){ applyZoom(parseFloat(zoomInp.value)); });
  document.getElementById("zoomIn").addEventListener("click", function(){ applyZoom(zoom*1.6); });
  document.getElementById("zoomOut").addEventListener("click", function(){ applyZoom(zoom/1.6); });

  /* 滚轮转横向滚动 */
  elScroll.addEventListener("wheel", function(ev){
    if(Math.abs(ev.deltaY) > Math.abs(ev.deltaX)){
      elScroll.scrollLeft += ev.deltaY; ev.preventDefault();
    }
  }, {passive:false});

  render();
})();
</script>
